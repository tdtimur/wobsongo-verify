[[package]]
name = "wobsongo-verify"
version = "0.1.2"
source = { virtual = "." }
dependencies = [
    { name = "bcrypt" },
    { name = "litestar" },
    { name = "pyjwt" },
    { name = "python-dotenv" },
]

[package.optional-dependencies]
db = [
    { name = "sqlite-vec" },
]
docs = [
    { name = "mkdocs" },
    { name = "mkdocs-material" },
]
embed = [
    { name = "sentence-transformers" },
]
llm = [
    { name = "openai" },
]
ollama = [
    { name = "ollama" },
]
pdf = [
    { name = "liteparse" },
    { name = "pypdf" },
]
storage = [
    { name = "boto3" },
]
telegram = [
    { name = "python-telegram-bot" },
]

[package.dev-dependencies]
dev = [
    { name = "mypy" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "uvicorn" },
]

[package.metadata]
requires-dist = [
    { name = "bcrypt", specifier = ">=4.0" },
    { name = "boto3", marker = "extra == 'storage'", specifier = ">=1.34" },
    { name = "liteparse", marker = "extra == 'pdf'", specifier = ">=2.0.0" },
    { name = "litestar", specifier = ">=2.0" },
    { name = "mkdocs", marker = "extra == 'docs'", specifier = ">=1.6.1" },
    { name = "mkdocs-material", marker = "extra == 'docs'", specifier = ">=9.7.1" },
    { name = "ollama", marker = "extra == 'ollama'", specifier = ">=0.4" },
    { name = "openai", marker = "extra == 'llm'", specifier = ">=1.0" },
    { name = "pyjwt", specifier = ">=2.8" },
    { name = "pypdf", marker = "extra == 'pdf'", specifier = ">=4.0" },
    { name = "python-dotenv", specifier = ">=1.0" },
    { name = "python-telegram-bot", marker = "extra == 'telegram'", specifier = ">=21.0" },
    { name = "sentence-transformers", marker = "extra == 'embed'", specifier = ">=3.0" },
    { name = "sqlite-vec", marker = "extra == 'db'", specifier = ">=0.1" },
]
provides-extras = ["embed", "db", "pdf", "llm", "ollama", "telegram", "storage", "docs"]

[package.metadata.requires-dev]
dev = [
    { name = "mypy", specifier = ">=1.10" },
    { name = "pytest", specifier = ">=8.0" },
    { name = "pytest-asyncio", specifier = ">=0.23" },
    { name = "uvicorn", specifier = ">=0.30" },
]
